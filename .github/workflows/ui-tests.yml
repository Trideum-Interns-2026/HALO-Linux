# Builds the ui bridge package and runs its tests, plus the ground-station web API tests.
# Plain ros:jazzy image: no sim, and the HTTP call is faked.
name: ui-tests

on:
  push:
    branches: [main]
    paths:
      - "UI/**"
      - "GroundstationAPI/**"
      - "geolocation_msgs/**"
      - "tracking_msgs/**"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "UI/**"
      - "GroundstationAPI/**"
      - "geolocation_msgs/**"
      - "tracking_msgs/**"
      - ".github/workflows/ui-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-pytest python3-pip python3-venv \
            ros-jazzy-rosidl-default-generators ros-jazzy-rosidl-default-runtime \
            ros-jazzy-ament-lint-auto ros-jazzy-ament-lint-common

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths geolocation_msgs tracking_msgs UI \
            --packages-select geolocation_msgs tracking_msgs ui

      - name: Test bridge
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --base-paths geolocation_msgs tracking_msgs UI \
            --packages-select ui --event-handlers console_direct+
          colcon test-result --verbose

      - name: Test web API
        run: |
          python3 -m venv /tmp/api-venv
          /tmp/api-venv/bin/pip install -r GroundstationAPI/requirements-dev.txt
          cd GroundstationAPI && /tmp/api-venv/bin/python -m pytest -v
