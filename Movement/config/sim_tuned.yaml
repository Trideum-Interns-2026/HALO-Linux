# Conservative SITL settings for PX4 x500 + Gazebo. Retune with `movement_tune` after changing the
# vehicle, camera, or controller; these were selected for the previous follow controller and are
# not certified for real hardware.
# Load with `ros2 launch movement movement.launch.py params_file:=<path>` (`sim_check --tuned` does).
/**:
  ros__parameters:
    yaw_gain: 0.8
    forward_gain: 0.5
    orbit_yaw_ki: 20.0
    max_forward_accel_m_s2: 0.3
    max_strafe_accel_m_s2: 0.15
    max_yaw_accel_deg_s2: 15.0
    # Low-pass after the acceleration limits: rounds off acceleration steps (low jerk). Searched
    # together with the gains because lag in the loop costs stability (movement_tune, jerk term).
    command_smoothing_s: 0.1
    # On target loss: hold position and sweep the nose +-60 deg around the last known direction
    # for 12 s (one full sweep), then continue scanning in place.
    last_known_search_s: 12.0
    last_known_sweep_deg: 60.0
    last_known_rate_deg_s: 20.0
